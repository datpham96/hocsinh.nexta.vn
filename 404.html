<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <!-- Fallback redirect if JS is disabled -->
  <meta http-equiv="refresh" content="0; url=/hocsinh.nexta.vn/">
  <script>
    (function() {
      // Base path for GitHub Pages project
      var projectBase = '/hocsinh.nexta.vn';
      // Strip project base from pathname
      var path = location.pathname.replace(projectBase, '');
      if (!path.startsWith('/')) path = '/' + path;
      var search = location.search || '';
      var hash = location.hash || '';
      // Redirect to hash-based route so SPA can handle it
      var target = projectBase + '/#' + path + search + hash;
      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/hocsinh.nexta.vn/">
  </noscript>
  <style>html,body{margin:0;height:100%;}</style>
  </head>
  <body></body>
  </html>
